name: CI

# Trigger the workflow on push or pull request
on:
  push:
    branches:
      - master
      - main
  pull_request:

# the `concurrency` settings ensure that not too many CI jobs run in parallel
concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # The CI test job
  test:
    name: ${{ matrix.gap-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gap-version:
          - 'devel'   # current GAP development version from git
          - 'latest'  # latest GAP release
          - 'minimal' # oldest GAP release supported by this package

    steps:
      - uses: actions/checkout@v6
      - name: 'Install X Window development files'
        run: |
          sudo apt-get update
          sudo apt-get install libx11-dev libxaw7-dev xvfb
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: ${{ matrix.gap-version }}
      - uses: gap-actions/build-pkg@v3
      # gap-actions/run-pkg-tests first loads the package, which xgap
      # refuses unless GAP runs with `-p`
      - name: 'Run tests'
        run: |
          mkdir -p /tmp/gaproot/pkg
          ln -f -s $PWD /tmp/gaproot/pkg/
          $GAPROOT/gap -l "/tmp/gaproot;" --quitonbreak tst/testall.g
      # XGAP does not pass on GAP's exit status, see tst-gui/run.g
      - name: 'Run tests in XGAP'
        run: |
          mkdir -p coverage
          export TERM=dumb  # as xgap.sh does
          xvfb-run -a timeout 600 bin/*/xgap -G $GAPROOT/gap -- \
              -l "/tmp/gaproot;" --quitonbreak \
              --cover coverage/gui.coverage tst-gui/run.g || true
          cat tst-gui.log
          grep -qx true tst-gui.status
      - uses: gap-actions/process-coverage@v3
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The documentation job
  manual:
    name: Build manuals
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: gap-actions/setup-gap@v3
      - uses: gap-actions/build-pkg-docs@v2
        with:
          use-latex: 'true'
          warnings-as-errors: 'false'  # see https://github.com/gap-actions/build-pkg-docs/issues/34
      - name: 'Upload documentation'
        uses: actions/upload-artifact@v4
        with:
          name: manual
          path: ./doc/manual.pdf
          if-no-files-found: error
